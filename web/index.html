<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E1118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Chrome Dino: Mobile Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #06080C;
      color: #E0E6ED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Mathematically guarantees exact 800:300 ratio with 0 internal letterbox offsets */
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 800 / 300));
      height: min(100vh, calc(100vw * 300 / 800));
      aspect-ratio: 800 / 300;
      background: #0E1118;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    /* Dedicated SET button: completely isolated from canvas touch events (CANNOT trigger jump) */
    #set-btn {
      position: absolute;
      top: 2.6%;
      left: 22.2%;
      width: 8.5%;
      height: 9.3%;
      min-width: 58px;
      min-height: 28px;
      background: rgba(22, 26, 36, 0.92);
      border: 1px solid #00E5FF;
      color: #00E5FF;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      backdrop-filter: blur(4px);
    }
    #set-btn:active {
      background: #00E5FF;
      color: #0E1118;
    }
    #rotate-hint {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.96);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #00E5FF;
    }
    @media (orientation: portrait) and (max-width: 600px) {
      #rotate-hint { display: flex; }
    }
    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="rotate-hint">
    <div style="font-size: 48px; margin-bottom: 16px;">🔄</div>
    <h2>Rotate your phone to Landscape</h2>
    <p style="color: #78909C; margin-top: 8px; font-size: 14px;">For the full widescreen arcade experience</p>
  </div>

  <div id="game-container">
    <canvas id="screen" width="800" height="300"></canvas>
    <div id="scanline-overlay"></div>
    <!-- Dedicated Set Button: click/touch is trapped and never causes a jump -->
    <button id="set-btn" onclick="handleSetClick(event)">⚙ SET</button>
  </div>

  <script>
    // --- 8-BIT PROCEDURAL AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
    }
    function playTone(freq, duration, type = 'square') {
      if (!actx || game.muted) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.12, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }
    function soundJump() {
      initAudio();
      if (!actx || game.muted) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(140, actx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(420, actx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, actx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.12);
    }
    function soundScore() {
      playTone(660, 0.08, 'square');
      setTimeout(() => playTone(880, 0.14, 'square'), 80);
    }
    function soundGameOver() {
      playTone(180, 0.15, 'sawtooth');
      setTimeout(() => playTone(140, 0.25, 'sawtooth'), 150);
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 300, GROUND_Y = 240;

    const game = {
      state: 'START', // 'START', 'PLAYING', 'GAMEOVER'
      score: 0,
      highScore: parseInt(localStorage.getItem('dino_hi') || '0'),
      speed: 340,
      baseSpeed: 340,
      dist: 0,
      muted: false,
      crt: false,
      turbo: false,
      weather: 'CLEAR', // 'CLEAR', 'RAIN', 'STORM', 'SAND'
      palette: 'CLASSIC', // 'CLASSIC', 'CYBERPUNK', 'GAMEBOY'
      settingsOpen: false,
      
      // Dino positioned comfortably away from left thumb pad (x: 115 vs pad at x: 55)
      dino: {
        x: 115,
        y: GROUND_Y - 47,
        vy: 0,
        w: 44,
        h: 47,
        isJumping: false,
        isDucking: false,
        legFrame: 0,
        legTimer: 0,
        jumpHeld: false
      },

      obstacles: [],
      particles: [],
      clouds: [
        { x: 120, y: 50, spd: 25 },
        { x: 380, y: 35, spd: 30 },
        { x: 620, y: 65, spd: 20 }
      ],
      stars: Array.from({ length: 25 }, () => ({ x: Math.random() * W, y: Math.random() * 120, b: Math.random() })),
      spawnTimer: 0,

      reset() {
        this.score = 0;
        this.speed = this.turbo ? 520 : this.baseSpeed;
        this.dist = 0;
        this.dino.y = GROUND_Y - 47;
        this.dino.vy = 0;
        this.dino.isJumping = false;
        this.dino.isDucking = false;
        this.obstacles = [];
        this.particles = [];
        this.spawnTimer = 1.0;
        this.state = 'PLAYING';
      },

      jump() {
        if (this.settingsOpen) return; // NEVER jump while settings modal is open!
        initAudio();
        if (this.state === 'START' || this.state === 'GAMEOVER') {
          this.reset();
          return;
        }
        if (!this.dino.isJumping) {
          this.dino.isJumping = true;
          this.dino.vy = -680;
          this.dino.jumpHeld = true;
          soundJump();
        }
      },

      duck(val) {
        if (this.state !== 'PLAYING' || this.settingsOpen) return;
        this.dino.isDucking = val;
        if (val && this.dino.isJumping) {
          this.dino.vy += 450; // Fast-fall dive
        }
      },

      toggleSettings() {
        initAudio();
        this.settingsOpen = !this.settingsOpen;
        if (this.settingsOpen && this.dino) {
          this.dino.jumpHeld = false; // Cancel any active jump holding
        }
      },

      toggleWeather() {
        const order = ['CLEAR', 'RAIN', 'STORM', 'SAND'];
        this.weather = order[(order.indexOf(this.weather) + 1) % order.length];
      },

      togglePalette() {
        const order = ['CLASSIC', 'CYBERPUNK', 'GAMEBOY'];
        this.palette = order[(order.indexOf(this.palette) + 1) % order.length];
      },

      toggleTurbo() {
        this.turbo = !this.turbo;
        if (this.state === 'PLAYING') {
          this.speed = this.turbo ? 550 : 340;
        }
      },

      toggleScanlines() {
        this.crt = !this.crt;
        document.getElementById('scanline-overlay').className = this.crt ? 'scanlines' : '';
      }
    };

    // Dedicated handler for Set button: completely blocks propagation to jump handlers
    function handleSetClick(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      game.toggleSettings();
    }
    const setBtn = document.getElementById('set-btn');
    setBtn.addEventListener('touchstart', handleSetClick, { passive: false });

    // --- SPRITE BITMAP DEFINITIONS ---
    function drawDino(x, y, ducking, leg) {
      ctx.save();
      const col = game.palette === 'GAMEBOY' ? '#8BAC0F' : (game.palette === 'CYBERPUNK' ? '#00E5FF' : (game.turbo ? '#FF3366' : '#E0E6ED'));
      ctx.fillStyle = col;

      if (!ducking) {
        // Standing Dino (44x47)
        ctx.fillRect(x + 22, y, 20, 16);
        ctx.fillRect(x + 26, y + 16, 16, 8);
        ctx.fillRect(x + 12, y + 12, 16, 22);
        // Eye
        ctx.fillStyle = game.palette === 'GAMEBOY' ? '#0F380F' : '#0E1118';
        ctx.fillRect(x + 26, y + 3, 3, 3);
        ctx.fillStyle = col;
        // Snout
        ctx.fillRect(x + 36, y + 8, 6, 8);
        // Tail
        ctx.fillRect(x, y + 16, 6, 4);
        ctx.fillRect(x + 4, y + 20, 8, 10);
        // Legs
        if (game.dino.isJumping) {
          ctx.fillRect(x + 16, y + 34, 4, 10);
          ctx.fillRect(x + 24, y + 34, 4, 8);
        } else {
          if (leg === 0) {
            ctx.fillRect(x + 16, y + 34, 4, 12);
            ctx.fillRect(x + 26, y + 34, 4, 6);
          } else {
            ctx.fillRect(x + 16, y + 34, 4, 6);
            ctx.fillRect(x + 26, y + 34, 4, 12);
          }
        }
        // Arm
        ctx.fillRect(x + 26, y + 24, 6, 3);
      } else {
        // Ducking Dino (59x26)
        ctx.fillRect(x + 8, y + 8, 38, 14);
        ctx.fillRect(x + 38, y, 20, 12);
        // Eye
        ctx.fillStyle = game.palette === 'GAMEBOY' ? '#0F380F' : '#0E1118';
        ctx.fillRect(x + 44, y + 3, 3, 3);
        ctx.fillStyle = col;
        // Tail
        ctx.fillRect(x, y + 10, 8, 8);
        // Legs
        if (leg === 0) {
          ctx.fillRect(x + 20, y + 22, 5, 8);
          ctx.fillRect(x + 32, y + 22, 5, 4);
        } else {
          ctx.fillRect(x + 20, y + 22, 5, 4);
          ctx.fillRect(x + 32, y + 22, 5, 8);
        }
      }

      // Sunglasses cosmetic at score >= 500
      if (game.score >= 500) {
        ctx.fillStyle = '#000000';
        const sy = y + 3;
        const sx = ducking ? x + 42 : x + 24;
        ctx.fillRect(sx, sy, 10, 4);
        ctx.fillRect(sx + 10, sy + 1, 6, 2);
      }
      ctx.restore();
    }

    function drawCactus(x, y, w, h) {
      ctx.save();
      ctx.fillStyle = game.palette === 'GAMEBOY' ? '#306230' : (game.palette === 'CYBERPUNK' ? '#FF0055' : (game.turbo ? '#FF5500' : '#4CAF50'));
      // Stem
      ctx.fillRect(x + (w/2) - 3, y, 6, h);
      // Left arm
      if (h > 30) {
        ctx.fillRect(x, y + 10, 4, 14);
        ctx.fillRect(x, y + 20, w/2, 4);
      }
      // Right arm
      if (w > 20) {
        ctx.fillRect(x + w - 4, y + 14, 4, 14);
        ctx.fillRect(x + (w/2), y + 24, (w/2), 4);
      }
      ctx.restore();
    }

    function drawPterodactyl(x, y, wingUp) {
      ctx.save();
      ctx.fillStyle = game.palette === 'GAMEBOY' ? '#8BAC0F' : (game.palette === 'CYBERPUNK' ? '#FFD700' : '#00E5FF');
      // Body & beak
      ctx.fillRect(x + 12, y + 10, 18, 6);
      ctx.fillRect(x + 30, y + 12, 10, 4);
      // Eye
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 26, y + 8, 2, 2);
      ctx.fillStyle = game.palette === 'CYBERPUNK' ? '#FFD700' : '#00E5FF';
      // Wings
      if (wingUp) {
        ctx.fillRect(x + 14, y, 8, 10);
        ctx.fillRect(x + 18, y + 4, 12, 6);
      } else {
        ctx.fillRect(x + 14, y + 16, 8, 12);
        ctx.fillRect(x + 18, y + 16, 12, 6);
      }
      ctx.restore();
    }

    // --- GAME LOOP & UPDATES ---
    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);
      render();
    }

    function update(dt) {
      if (game.settingsOpen) return;

      if (game.state === 'PLAYING') {
        game.dist += game.speed * dt;
        const newScore = Math.floor(game.dist / 10);
        if (newScore > game.score && newScore % 100 === 0) {
          soundScore();
        }
        game.score = newScore;
        if (game.score > game.highScore) {
          game.highScore = game.score;
          localStorage.setItem('dino_hi', game.highScore);
        }
        game.speed += 3.5 * dt;

        // Dino Physics
        const d = game.dino;
        if (d.isJumping) {
          const grav = d.jumpHeld ? 1600 : 2600;
          d.vy += grav * dt;
          d.y += d.vy * dt;
          const targetGround = d.isDucking ? GROUND_Y - 26 : GROUND_Y - 47;
          if (d.y >= targetGround) {
            d.y = targetGround;
            d.vy = 0;
            d.isJumping = false;
          }
        } else {
          d.y = d.isDucking ? GROUND_Y - 26 : GROUND_Y - 47;
          d.legTimer += dt;
          if (d.legTimer >= 0.08) {
            d.legFrame = (d.legFrame + 1) % 2;
            d.legTimer = 0;
          }
        }

        // Spawn Obstacles
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          const isPtero = game.score > 200 && Math.random() < 0.35;
          if (isPtero) {
            const altitudes = [GROUND_Y - 30, GROUND_Y - 55, GROUND_Y - 75];
            game.obstacles.push({
              type: 'ptero',
              x: W + 20,
              y: altitudes[Math.floor(Math.random() * altitudes.length)],
              w: 42,
              h: 28,
              wingTimer: 0,
              wingUp: false
            });
          } else {
            const tall = Math.random() > 0.5;
            const h = tall ? 44 : 32;
            const w = tall ? 24 : 18;
            game.obstacles.push({
              type: 'cactus',
              x: W + 20,
              y: GROUND_Y - h,
              w: w,
              h: h
            });
          }
          const minGap = game.turbo ? 0.9 : 1.2;
          game.spawnTimer = minGap + Math.random() * 1.0;
        }

        // Move Obstacles & Collision Check
        const dw = d.isDucking ? 55 : 40;
        const dh = d.isDucking ? 24 : 44;
        const dx = d.x + 4;
        const dy = d.y + 2;

        for (let i = game.obstacles.length - 1; i >= 0; i--) {
          const obs = game.obstacles[i];
          obs.x -= game.speed * dt;
          if (obs.type === 'ptero') {
            obs.wingTimer += dt;
            if (obs.wingTimer >= 0.12) {
              obs.wingUp = !obs.wingUp;
              obs.wingTimer = 0;
            }
          }

          // AABB Hitbox
          if (dx < obs.x + obs.w && dx + dw > obs.x && dy < obs.y + obs.h && dy + dh > obs.y) {
            game.state = 'GAMEOVER';
            soundGameOver();
            break;
          }

          if (obs.x + obs.w < -50) {
            game.obstacles.splice(i, 1);
          }
        }

        // Weather particles
        if (game.weather === 'RAIN' || game.weather === 'STORM') {
          if (Math.random() < 0.8) {
            game.particles.push({
              x: Math.random() * W,
              y: 0,
              vx: -120,
              vy: 550,
              len: 12,
              type: 'rain'
            });
          }
        }
        if (game.weather === 'SAND') {
          if (Math.random() < 0.6) {
            game.particles.push({
              x: W,
              y: Math.random() * H,
              vx: -550,
              vy: (Math.random() - 0.5) * 80,
              len: 6,
              type: 'sand'
            });
          }
        }
        for (let i = game.particles.length - 1; i >= 0; i--) {
          const p = game.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x < -20 || p.y > H + 20) game.particles.splice(i, 1);
        }
      }

      // Clouds
      for (const c of game.clouds) {
        c.x -= c.spd * dt;
        if (c.x < -60) c.x = W + 40;
      }
    }

    // --- RENDER FUNCTION ---
    function render() {
      // 1. Clear background
      if (game.palette === 'GAMEBOY') {
        ctx.fillStyle = '#0F380F';
      } else if (game.palette === 'CYBERPUNK') {
        ctx.fillStyle = '#0A0612';
      } else {
        ctx.fillStyle = game.turbo ? '#180B10' : '#0E1118';
      }
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (const s of game.stars) {
        ctx.fillRect(s.x, s.y, 2, 2);
      }

      // Clouds
      ctx.fillStyle = 'rgba(100, 120, 140, 0.35)';
      for (const c of game.clouds) {
        ctx.fillRect(c.x, c.y, 40, 12);
        ctx.fillRect(c.x + 8, c.y - 6, 24, 8);
      }

      // Ground Line
      ctx.fillStyle = game.palette === 'GAMEBOY' ? '#306230' : (game.palette === 'CYBERPUNK' ? '#00E5FF' : '#455A64');
      ctx.fillRect(0, GROUND_Y, W, 2);

      // Dino Drop Shadow
      const shadowW = Math.max(16, 42 - (GROUND_Y - (game.dino.y + (game.dino.isDucking ? 26 : 47))) * 0.4);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(game.dino.x + 22, GROUND_Y + 2, shadowW / 2, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dino
      drawDino(game.dino.x, game.dino.y, game.dino.isDucking, game.dino.legFrame);

      // Obstacles
      for (const obs of game.obstacles) {
        if (obs.type === 'cactus') {
          drawCactus(obs.x, obs.y, obs.w, obs.h);
        } else {
          drawPterodactyl(obs.x, obs.y, obs.wingUp);
        }
      }

      // Weather Particles
      ctx.strokeStyle = game.weather === 'SAND' ? '#FFA726' : '#80D8FF';
      ctx.lineWidth = 1.5;
      for (const p of game.particles) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.vx * 0.02, p.y + p.vy * 0.02);
        ctx.stroke();
      }

      // --- TOP HUD: CLEAN, BALANCED, ZERO OVERLAP ---

      // 1. Top-Left: Speedometer & Weather badge (x: 8..168)
      ctx.fillStyle = 'rgba(15, 19, 28, 0.85)';
      ctx.fillRect(8, 8, 160, 28);
      ctx.strokeStyle = '#00E5FF';
      ctx.lineWidth = 1;
      ctx.strokeRect(8, 8, 160, 28);
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#00E5FF';
      ctx.fillText(`SPD: ${(game.speed / 340).toFixed(1)}x`, 16, 26);
      ctx.fillStyle = '#FFD700';
      ctx.fillText(`WX: ${game.weather}`, 88, 26);

      // 2. Top-Right: High Score & Live Score (x: W-200..W-8) (Unobstructed)
      ctx.fillStyle = 'rgba(15, 19, 28, 0.85)';
      ctx.fillRect(W - 200, 8, 192, 28);
      ctx.strokeStyle = '#00E5FF';
      ctx.lineWidth = 1;
      ctx.strokeRect(W - 200, 8, 192, 28);

      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = '#78909C';
      ctx.fillText(`HI ${String(game.highScore).padStart(5, '0')}`, W - 188, 26);
      ctx.fillStyle = '#00FF88';
      ctx.fillText(String(game.score).padStart(5, '0'), W - 80, 26);

      // Virtual Touch Pads
      drawTouchPads();

      // Modal / Overlay Screens
      if (game.settingsOpen) {
        drawSettingsModal();
      } else if (game.state === 'START') {
        drawStartCard();
      } else if (game.state === 'GAMEOVER') {
        drawGameOverCard();
      }
    }

    function drawTouchPads() {
      // Left Duck Pad (centered at x: 55, y: H - 45)
      ctx.fillStyle = 'rgba(0, 229, 255, 0.12)';
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(55, H - 45, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#00E5FF';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('▼ DUCK', 55, H - 41);

      // Right Jump Pad (centered at x: W - 55, y: H - 45)
      ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.5)';
      ctx.beginPath();
      ctx.arc(W - 55, H - 45, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#00FFCC';
      ctx.fillText('▲ JUMP', W - 55, H - 41);
      ctx.textAlign = 'left';
    }

    function drawStartCard() {
      const cw = 440, ch = 130;
      const cx = (W - cw) / 2, cy = 60;
      ctx.fillStyle = 'rgba(14, 17, 25, 0.94)';
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = '#00E5FF';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.textAlign = 'center';
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('CHROME DINO: PURE RASTER ENGINE', cx + cw / 2, cy + 25);

      ctx.font = 'bold 18px monospace';
      ctx.fillStyle = (Math.floor(Date.now() / 400) % 2 === 0) ? '#00FFCC' : '#00BFA5';
      ctx.fillText('► TAP SCREEN TO JUMP ◄', cx + cw / 2, cy + 62);

      ctx.font = '11px monospace';
      ctx.fillStyle = '#90A4AE';
      ctx.fillText('SWIPE DOWN OR LEFT PAD TO DUCK', cx + cw / 2, cy + 90);
      ctx.fillText('TAP [⚙ SET] BUTTON FOR PREFERENCES', cx + cw / 2, cy + 108);
      ctx.textAlign = 'left';
    }

    function drawGameOverCard() {
      const cw = 340, ch = 120;
      const cx = (W - cw) / 2, cy = 65;
      ctx.fillStyle = 'rgba(22, 14, 18, 0.95)';
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = '#FF0055';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.textAlign = 'center';
      ctx.font = 'bold 20px monospace';
      ctx.fillStyle = '#FF2266';
      ctx.fillText('G A M E   O V E R', cx + cw / 2, cy + 32);

      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(`SCORE: ${game.score}   BEST: ${game.highScore}`, cx + cw / 2, cy + 60);

      ctx.fillStyle = '#00FFCC';
      ctx.fillText('► TAP ANYWHERE TO RETRY ◄', cx + cw / 2, cy + 95);
      ctx.textAlign = 'left';
    }

    function drawSettingsModal() {
      const cw = 400, ch = 200;
      const cx = (W - cw) / 2, cy = 35;
      ctx.fillStyle = 'rgba(10, 14, 22, 0.96)';
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.textAlign = 'center';
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('TOUCH SETTINGS & PREFERENCES', cx + cw / 2, cy + 24);
      ctx.textAlign = 'left';

      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#00E5FF';
      ctx.fillText(`[1] WEATHER:    ${game.weather} (Tap)`, cx + 30, cy + 55);
      ctx.fillText(`[2] PALETTE:    ${game.palette} (Tap)`, cx + 30, cy + 80);
      ctx.fillText(`[3] TURBO:      ${game.turbo ? 'ON [HARDCORE]' : 'OFF [NORMAL]'} (Tap)`, cx + 30, cy + 105);
      ctx.fillText(`[4] CRT SCAN:   ${game.crt ? 'ENABLED' : 'DISABLED'} (Tap)`, cx + 30, cy + 130);
      ctx.fillText(`[5] AUDIO:      ${game.muted ? 'MUTED' : 'ACTIVE'} (Tap)`, cx + 30, cy + 155);

      ctx.fillStyle = '#FF5500';
      ctx.textAlign = 'center';
      ctx.fillText('► TAP HERE TO CLOSE ◄', cx + cw / 2, cy + 185);
      ctx.textAlign = 'left';
    }

    // --- ACCURATE TOUCH & POINTER CONTROLS ---
    let touchStartY = 0;
    
    function getCanvasCoords(touch) {
      const rect = canvas.getBoundingClientRect();
      const x = (touch.clientX - rect.left) * (W / rect.width);
      const y = (touch.clientY - rect.top) * (H / rect.height);
      return { x, y };
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();

      const t = e.touches[0];
      const { x, y } = getCanvasCoords(t);
      touchStartY = y;

      // Settings Modal interaction (NEVER triggers jump)
      if (game.settingsOpen) {
        const cw = 400, ch = 200;
        const cx = (W - cw) / 2, cy = 35;
        if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) {
          const relY = y - cy;
          if (relY >= 35 && relY < 65) game.toggleWeather();
          else if (relY >= 65 && relY < 95) game.togglePalette();
          else if (relY >= 95 && relY < 125) game.toggleTurbo();
          else if (relY >= 125 && relY < 155) game.toggleScanlines();
          else if (relY >= 155 && relY < 185) game.muted = !game.muted;
          else if (relY >= 185) game.settingsOpen = false;
        } else {
          game.settingsOpen = false;
        }
        return; // ABSOLUTELY DO NOT PROCEED TO JUMP
      }

      // Left Duck pad touch
      if (x <= 100 && y >= H - 90) {
        game.duck(true);
        return;
      }

      // Normal gameplay jump
      game.jump();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const { y } = getCanvasCoords(t);
      if (y - touchStartY > 30) {
        game.duck(true); // Swipe down detected
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      game.dino.jumpHeld = false;
      game.duck(false);
    }, { passive: false });

    // Keyboard support for PC browser testing
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') game.jump();
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') game.duck(true);
      else if (e.code === 'KeyW') game.toggleWeather();
      else if (e.code === 'KeyP') game.togglePalette();
      else if (e.code === 'KeyT') game.toggleTurbo();
      else if (e.code === 'KeyC') game.toggleScanlines();
      else if (e.code === 'Escape') game.toggleSettings();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') game.dino.jumpHeld = false;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') game.duck(false);
    });

    // Start Loop
    requestAnimationFrame(loop);
  </script>
</body>
</html>
